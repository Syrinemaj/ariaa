version: "3.9"

services:

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: aria-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./:/app
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: aria-worker
    env_file:
      - .env
    volumes:
      - ./:/app
    depends_on:
      - postgres
      - redis

  postgres:
    image: pgvector/pgvector:pg16
    container_name: aria-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - aria10_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: aria-redis
    ports:
      - "6379:6379"

  frontend:
    image: node:20-slim
    container_name: aria-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && ARIA_API_URL=http://api:8000 npm run dev -- --host 0.0.0.0"
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: aria-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - aria10_prometheus_data:/prometheus
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.1.0
    container_name: aria-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - aria10_grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  aria10_postgres_data:
  aria10_prometheus_data:
  aria10_grafana_data:
